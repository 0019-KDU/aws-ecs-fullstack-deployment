# Production nginx config for a React SPA served behind a reverse proxy / load balancer.
# Assumes TLS is terminated upstream (ALB, Cloudfront, nginx LB, etc.).
# Listens on port 8080 to run as non-root user in ECS Fargate.
# ALB handles external port 80/443 routing.

worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /tmp/nginx.pid;          # writable by non-root user

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    # ── MIME types ──────────────────────────────────────────────────────────────
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ─────────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # ── Performance ─────────────────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;            # hide nginx version

    # ── Gzip compression ────────────────────────────────────────────────────────
    gzip             on;
    gzip_vary        on;
    gzip_proxied     any;
    gzip_comp_level  6;
    gzip_min_length  1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # ── Temp paths writable by non-root ─────────────────────────────────────────
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # ── Security headers ────────────────────────────────────────────────────
        add_header X-Frame-Options           "SAMEORIGIN"             always;
        add_header X-Content-Type-Options    "nosniff"                always;
        add_header X-XSS-Protection          "1; mode=block"          always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "geolocation=(), microphone=()" always;
        add_header Content-Security-Policy
            "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self';"
            always;

        # ── Aggressively cache hashed static assets ─────────────────────────────
        # Vite outputs files like: assets/index-BxTz9kL4.js — safe to cache forever
        location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ── index.html — never cache (SPA entry point) ──────────────────────────
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # ── Health check endpoint (used by Docker / ECS / ALB) ──────────────────
        location = /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # ── SPA fallback — all unknown paths → index.html ───────────────────────
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ── Block hidden files (.git, .env, etc.) ───────────────────────────────
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
